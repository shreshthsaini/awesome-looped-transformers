name: "🔗 Add a resource"
description: Suggest a codebase, checkpoint, blog post, talk, tutorial or benchmark.
title: "[Resource] "
labels: ["new-resource"]
body:
  - type: input
    id: name
    attributes:
      label: Name
    validations:
      required: true
  - type: input
    id: url
    attributes:
      label: Link
    validations:
      required: true
  - type: dropdown
    id: kind
    attributes:
      label: Kind
      options: [code, model, benchmark, blog, talk, tutorial]
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: One-sentence description
    validations:
      required: true
